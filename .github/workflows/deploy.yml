# .github/workflows/deploy.yml
#
# Production deploys are handled by Vercel's Git Integration: Vercel watches
# this repo and auto-deploys the `frontend/` build whenever `main` changes.
# No Vercel token is required here.
#
# This workflow is a gate: it verifies the production build succeeds so a
# broken build never reaches Vercel. If it passes, Vercel picks up the push.

name: Deploy (Production Build Verification)

on:
  push:
    branches: [main]

jobs:
  verify-production-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
